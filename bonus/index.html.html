<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Бонусные баллы · Kwora</title>
<meta name="robots" content="noindex" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Onest,sans-serif;
  background:#0C0D11;
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;padding:18px;
  overflow-x:hidden;
}
/* мягкое дыхание фона — фирменные цвета в темноте */
body::before, body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(90px);
  pointer-events:none;z-index:0;opacity:.35;
}
body::before{
  width:420px;height:420px;left:-140px;top:-120px;
  background:#7B61FF;animation:drift1 11s ease-in-out infinite alternate;
}
body::after{
  width:460px;height:460px;right:-160px;bottom:-140px;
  background:#3EA8FF;animation:drift2 13s ease-in-out infinite alternate;
}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(46px,34px) scale(1.12)}}
@keyframes drift2{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-40px,-30px) scale(1)}}
@media(prefers-reduced-motion:reduce){body::before,body::after{animation:none}}

.card{
  position:relative;z-index:1;
  background:#14161C;border:1px solid #282C38;border-radius:22px;
  padding:26px 24px;max-width:400px;width:100%;color:#EDEFF4;
  box-shadow:0 24px 70px -18px rgba(0,0,0,.8);
  animation:rise .5s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}

.brand{display:flex;align-items:center;gap:9px;margin-bottom:22px}
.brand .bx{
  width:32px;height:32px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,#7B61FF,#3EA8FF);
  color:#fff;font-weight:700;font-size:18px;
  display:flex;align-items:center;justify-content:center;
}
.brand .bt{font-weight:700;font-size:17px;letter-spacing:-.2px}

h1{font-size:22px;font-weight:700;margin-bottom:6px}
.desc{font-size:14px;color:#8A90A0;line-height:1.5;margin-bottom:22px}
label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;
  color:#8A90A0;letter-spacing:.09em;margin-bottom:8px}
input{
  width:100%;padding:13px;background:#0F1116;border:1px solid #282C38;
  border-radius:13px;color:#EDEFF4;font-size:15px;font-family:inherit;
  transition:border-color .18s,box-shadow .18s;
}
input::placeholder{color:#5F6673}
input:focus{outline:none;border-color:#7B61FF;box-shadow:0 0 0 3px rgba(123,97,255,.18)}
button{
  width:100%;padding:14px;border:none;border-radius:13px;color:#fff;
  background:linear-gradient(135deg,#7B61FF,#3EA8FF);
  font-weight:600;font-size:15px;cursor:pointer;margin-top:14px;font-family:inherit;
  box-shadow:0 10px 26px -10px rgba(123,97,255,.7);
  transition:transform .14s,box-shadow .14s,opacity .14s;
}
button:hover{transform:translateY(-1px);box-shadow:0 14px 30px -10px rgba(123,97,255,.8)}
button:active{transform:scale(.98)}
button:disabled{opacity:.5;box-shadow:none;transform:none}
button.ghost{background:#1B1E27;border:1px solid #282C38;box-shadow:none;margin-top:8px}
button.ghost:hover{background:#242833;transform:none}
.err{color:#FF6B6B;font-size:13px;margin-top:10px;min-height:18px;line-height:1.4}
.hide{display:none}
.acc{
  padding:13px;background:#0F1116;border:1px solid #282C38;border-radius:13px;
  margin-bottom:9px;cursor:pointer;
  transition:border-color .16s,background .16s,transform .16s;
  animation:rise .4s cubic-bezier(.2,.8,.3,1) both;
}
.acc:nth-child(2){animation-delay:.05s}
.acc:nth-child(3){animation-delay:.1s}
.acc:nth-child(4){animation-delay:.15s}
.acc:hover{border-color:#7B61FF;background:#171A22;transform:translateY(-1px)}
.acc:active{background:#1B1E27}
.acc .nick{font-weight:600;font-size:15px}
.acc .nm{font-size:13px;color:#8A90A0;margin-top:2px}
.done{text-align:center;padding:14px 0 4px;animation:rise .45s cubic-bezier(.2,.8,.3,1) both}
.done h2{font-size:20px;font-weight:700;margin-bottom:6px}
.done p{font-size:14px;color:#8A90A0}
/* галочка: штрих без фона */
.tick{width:96px;height:96px;margin:0 auto 22px;display:block}
.tick circle{
  fill:none;stroke:#51CF66;stroke-width:2.5;
  stroke-dasharray:170;stroke-dashoffset:170;
  transform-origin:50% 50%;transform:rotate(-90deg);
  animation:ring .55s cubic-bezier(.2,.7,.3,1) forwards;
}
.tick polyline{
  fill:none;stroke:#51CF66;stroke-width:3.2;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:36;stroke-dashoffset:36;
  animation:draw .38s cubic-bezier(.5,0,.4,1) .42s forwards;
}
@keyframes ring{to{stroke-dashoffset:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){
  .tick circle,.tick polyline,.card,.acc,.done{animation-duration:.01s;animation-delay:0s}
}
.spin{width:20px;height:20px;margin:16px auto 0;border:2px solid #282C38;
  border-top-color:#7B61FF;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">

  <div class="brand"><div class="bx">K</div><div class="bt">Kwora</div></div>

  <div id="stepMail">
    <h1>Бонусные баллы</h1>
    <p class="desc">Введи почту аккаунта Kwora и код с карточки.</p>
    <label for="mail">Почта</label>
    <input type="email" id="mail" inputmode="email" autocomplete="email" placeholder="you@example.com">
    <div style="height:14px"></div>
    <label for="code">Код</label>
    <input type="text" id="code" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX" maxlength="9"
      style="text-transform:uppercase;letter-spacing:.12em;font-family:'Courier New',monospace">
    <div class="err" id="errMail"></div>
    <button id="go">Продолжить</button>
  </div>

  <div id="stepPick" class="hide">
    <h1>Выбери аккаунт</h1>
    <p class="desc">На этой почте несколько аккаунтов.</p>
    <div id="accs"></div>
    <div class="err" id="errPick"></div>
    <button class="ghost" id="back">Назад</button>
  </div>

  <div id="stepDone" class="hide">
    <div class="done">
      <svg class="tick" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="27"/>
        <polyline points="20,33 28,41 44,24"/>
      </svg>
      <h2>Готово</h2>
      <p id="doneText">Баллы начислены</p>
    </div>
  </div>

  <div id="load" class="spin hide"></div>
</div>

<script type="module">
const $ = id => document.getElementById(id);



const show = id => {
  for (const s of ["stepMail","stepPick","stepDone"]) $(s).classList.toggle("hide", s !== id);
};
const busy = on => {
  $("load").classList.toggle("hide", !on);
  $("go").disabled = on;
};

let call = null;
try {
  const appMod = await import("/firebase-app.js");
  const fnMod  = await import("/firebase-functions.js");
  const app = appMod.initializeApp({
    apiKey: "AIzaSyCkp9-fJ30nYnDe0H0QsUVXlUeicw6hcEM",
    authDomain: "kwora-massanger.firebaseapp.com",
    projectId: "kwora-massanger",
    storageBucket: "kwora-massanger.firebasestorage.app",
    messagingSenderId: "895244701523",
    appId: "1:895244701523:web:cdc7591dda5315ba021ba6"
  });
  call = fnMod.httpsCallable(fnMod.getFunctions(app), "claimBonusCode");
} catch (e) {
  $("errMail").textContent = "Не удалось подключиться. Обнови страницу.";
  $("go").disabled = true;
}

const say = e => {
  const m = (e && e.message) || "";
  if (/resource-exhausted|использован/i.test(m)) return "Этот код уже использован.";
  if (/Такого кода нет/i.test(m)) return "Такого кода нет — проверь опечатки.";
  if (/нет аккаунт|Аккаунтов/i.test(m)) return "Аккаунтов с такой почтой нет.";
  return m || "Что-то пошло не так. Попробуй ещё раз.";
};

let savedMail = "", savedCode = "";

const won = pts => {
  const d = pts % 10, h = pts % 100;
  const w = (d === 1 && h !== 11) ? "балл" : (d >= 2 && d <= 4 && (h < 12 || h > 14)) ? "балла" : "баллов";
  $("doneText").textContent = "+" + pts + " " + w + " начислено";
};

$("go").onclick = async () => {
  const mail = $("mail").value.trim();
  const code = $("code").value.trim();
  $("errMail").textContent = "";
  if (!mail) { $("errMail").textContent = "Введи почту."; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) { $("errMail").textContent = "Проверь адрес почты."; return; }
  if (code.replace(/[^A-Za-z0-9]/g, "").length !== 8) { $("errMail").textContent = "В коде 8 символов."; return; }

  savedMail = mail; savedCode = code;
  busy(true);
  try {
    const r = await call({ code, mail });
    if (r.data && r.data.accounts) { pick(r.data.accounts); }
    else { won(r.data.points || 0); show("stepDone"); }
  } catch (e) {
    $("errMail").textContent = say(e);
  }
  busy(false);
};

function pick(list){
  const box = $("accs");
  box.replaceChildren();
  for (const a of list) {
    const row = document.createElement("div");
    row.className = "acc";
    const n1 = document.createElement("div");
    n1.className = "nick";
    n1.textContent = "@" + (a.nick || "");
    const n2 = document.createElement("div");
    n2.className = "nm";
    n2.textContent = a.name || "";
    row.append(n1);
    if (a.name) row.append(n2);
    row.onclick = () => take(a.uid);
    box.append(row);
  }
  show("stepPick");
}

async function take(uid){
  $("errPick").textContent = "";
  $("load").classList.remove("hide");
  try {
    const r = await call({ code: savedCode, mail: savedMail, uid });
    won(r.data.points || 0);
    show("stepDone");
  } catch (e) {
    $("errPick").textContent = say(e);
  }
  $("load").classList.add("hide");
}

$("back").onclick = () => { show("stepMail"); };
$("mail").addEventListener("keydown", e => { if (e.key === "Enter") $("code").focus(); });
$("code").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
</script>
</body>
</html>
