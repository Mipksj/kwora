name: get firebase
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download & patch firebase sdk
        run: |
          V=10.12.2
          for f in firebase-app.js firebase-auth.js firebase-firestore.js firebase-functions.js firebase-messaging.js firebase-storage.js firebase-app-compat.js firebase-messaging-compat.js; do
            curl -fsSL "https://www.gstatic.com/firebasejs/$V/$f" -o "$f"
            sed -i "s#https://www.gstatic.com/firebasejs/$V/#./#g" "$f"
          done
      - name: commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add firebase-*.js
          git commit -m "firebase sdk self-host [skip ci]" || echo "nothing to commit"
          git push
